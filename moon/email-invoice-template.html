<div style="font-family:Tahoma,Arial,sans-serif;max-width:600px;margin:auto;background:#fff;border:1px solid #e7dcc0;direction:rtl;text-align:right;color:#222">
  <div style="background:#0b0b0b;padding:20px;text-align:center">
    <img src="{{logo_url}}" alt="Moon Perfumes" height="70" style="height:70px">
    <div style="color:#c9a227;font-size:14px;margin-top:6px">Moon Perfumes · القاهرة، مصر</div>
  </div>
  <div style="padding:20px">
    <h2 style="margin:0 0 8px;color:#8a6d12">شكرًا لطلبك يا {{customer_name}} 🌙</h2>
    <p style="margin:0 0 12px">رقم الطلب: <b>{{order_id}}</b><br>التاريخ: {{order_date}}</p>
    <div style="background:#faf6ea;padding:12px;border-radius:6px;white-space:pre-line">{{order_details}}</div>
    <p style="margin-top:14px">الإجمالي (شامل الشحن): <b>{{total_price}}</b></p>
    <p style="text-align:center;margin:22px 0">
      <a href="{{invoice_url}}" style="background:#c9a227;color:#000;padding:12px 24px;border-radius:6px;text-decoration:none;font-weight:bold">🧾 عرض الفاتورة وطباعتها</a>
    </p>
    <p style="text-align:center"><img src="{{qr_url}}" width="130" height="130" alt="QR"><br><small style="color:#777">{{order_id}}</small></p>
  </div>
</div>
