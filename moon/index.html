.inv-paper{background:#fff;color:#111;margin:0 auto;padding:26px 30px;border-radius:6px;font-family:Tahoma,Arial,sans-serif;font-size:14px;line-height:1.6;width:100%;max-width:794px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
body.inv-pos80 .inv-paper{max-width:302px;width:302px;padding:10px;font-size:11px;line-height:1.5}
body.inv-pos58 .inv-paper{max-width:208px;width:208px;padding:8px;font-size:10px;line-height:1.45}
.inv-head{text-align:center;border-bottom:2px solid #c9a227;padding-bottom:10px;margin-bottom:12px}
.inv-logo{max-width:150px;max-height:95px;display:block;margin:0 auto 6px}
body.inv-pos80 .inv-logo{max-width:110px}
body.inv-pos58 .inv-logo{max-width:80px}
.inv-brand{font-family:'Playfair Display',Georgia,serif;font-size:30px;color:#9a7b12;line-height:1.1}
.inv-brand small{display:block;font-size:12px;letter-spacing:4px}
.inv-title{font-size:1.5em;font-weight:bold;letter-spacing:1px;margin-top:4px}
.inv-store{color:#555;font-size:.9em}
.inv-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:10px 0}
.inv-meta b{color:#111}
.inv-box{border:1px solid #ddd;border-radius:6px;padding:8px 12px;margin:10px 0}
.inv-box h4{margin:0 0 4px;color:#8a6d0b;font-size:1em}
.inv-box div{word-break:break-word}
.inv-table{width:100%;border-collapse:collapse;margin:10px 0}
.inv-table th{background:#f4efe0;text-align:start;padding:6px;font-size:.9em}
.inv-table td{padding:6px;border-bottom:1px solid #e5e5e5;vertical-align:top}
.inv-table .num{text-align:end;white-space:nowrap}
.inv-sub{color:#666;font-size:.85em;white-space:pre-line;word-break:break-word}
body.inv-pos80 .col-unit,body.inv-pos58 .col-unit{display:none}
.inv-totals{margin-inline-start:auto;width:min(320px,100%)}
.inv-totals div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.inv-totals .final{border-top:2px solid #111;font-weight:bold;font-size:1.15em;margin-top:4px;padding-top:6px}
.inv-note{background:#faf6e8;border:1px dashed #c9a227;border-radius:6px;padding:6px 10px;margin:8px 0;font-size:.9em}
.inv-foot{text-align:center;margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.inv-qr{width:110px;height:110px}
body.inv-pos80 .inv-qr{width:100px;height:100px}
body.inv-pos58 .inv-qr{width:84px;height:84px}
.inv-qr svg{width:100%;height:100%;display:block}
.inv-foot .cap{color:#666;font-size:.8em}
.inv-foot .oid{font-family:monospace;font-weight:bold;letter-spacing:1px}

.size-pill{min-width:84px;padding:8px 6px}
.promo-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px;color:var(--gold-light);font-size:14px}
.promo-box input{flex:1;min-width:120px;background:#141414;border:1px solid #333;color:#fff;border-radius:7px;padding:9px 12px;outline:none;text-transform:uppercase}
.promo-box input:focus{border-color:var(--gold)}
.tot-disc{color:#7fd48a}
.pay-opts label.pay-opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #333;border-radius:8px;margin-bottom:8px;cursor:pointer;color:#fff}
.pay-opts label.pay-opt:has(input:checked){border-color:var(--gold);background:rgba(201,162,39,.1)}
.pay-opts input{width:auto !important;padding:0 !important}
.pay-note{background:rgba(201,162,39,.1);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--gold-light);font-size:14px;margin-top:6px;white-space:pre-line}
.search-box{max-width:420px;margin:-10px auto 28px}
.search-box input{width:100%;background:#141414;border:1px solid #333;color:#fff;border-radius:22px;padding:11px 18px;outline:none;font-size:15px}
.search-box input:focus{border-color:var(--gold)}
.details-media{display:flex;flex-direction:column;align-items:center;min-width:0}
.thumbs{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:62px;height:62px;border:1px solid #444;border-radius:8px;overflow:hidden;padding:0;background:#111;cursor:pointer}
.thumbs button.on{border-color:var(--gold)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.wa-float{position:fixed;bottom:22px;inset-inline-end:18px;width:54px;height:54px;border-radius:50%;background:#25d366;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:2500;transition:.25s}
.wa-float:hover{transform:scale(1.08)}
.wa-float svg{width:30px;height:30px}
.foot-links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:16px}
.foot-links button{background:none;border:none;color:var(--gold-light);cursor:pointer;font-size:14px;text-decoration:underline}
.policy-page,.track-page{max-width:820px;margin:0 auto;padding:40px 20px}
.policy-page h3{color:var(--gold);margin:26px 0 6px}
.policy-page p{color:#ddd}
.policy-draft{color:#777;font-size:12px;margin-top:28px}
.track-box{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.track-box input{flex:1;min-width:200px;background:#141414;border:1px solid #333;color:#fff;border-radius:7px;padding:12px;outline:none;direction:ltr;text-align:start}
.track-box input:focus{border-color:var(--gold)}
.track-box .gold-button{margin:0}
.track-steps{list-style:none;margin:18px 0}
.track-steps li{padding:12px 16px;border:1px solid #333;border-radius:10px;margin-bottom:8px;color:#777}
.track-steps li.done{color:#fff;border-color:var(--gold);background:rgba(201,162,39,.1)}
.track-steps li.now{font-weight:bold;color:var(--gold-light)}
.track-msg{color:#ddd;margin:10px 0}
.track-bad{color:#ff8a80}
@media print{.wa-float{display:none !important}}
@media print{
  html,body{background:#fff !important}
  header,footer,.toast,.inv-actions,.subnav,.menu-panel{display:none !important}

  body.inv-pos80 .inv-paper{width:72mm;max-width:72mm}
  body.inv-pos58 .inv-paper{width:50mm;max-width:50mm}
}

/* ===== قاعدة بيانات Firebase (REST) ===== */
async function dbReq(method, path, body) {
  const res = await withTimeout(fetch(FIREBASE_DB_URL.replace(/\/+$/, "") + "/" + path + ".json", {
    method, headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined
  }), 9000);
  if (!res.ok) throw new Error("db " + res.status);
  return res.json();
}
function dbList(obj) {
  if (!obj || typeof obj !== "object") return [];
  return Object.keys(obj).map(k => Object.assign({}, obj[k], { id: k })).filter(x => x && typeof x.text === "string").sort((a, b) => (a.ts || 0) - (b.ts || 0));
}
function rateOk() {
  const last = Number(lsGet("moonLastPost", "0")) || 0;
  if (Date.now() - last < 15000) { toast(t("postWait")); return false; }
  return true;
}
function markPosted() { lsSet("moonLastPost", Date.now()); }
function postFailToast(err) {
  console.error("post failed:", err);
  toast(t("postFail") + " (" + String((err && err.message) || err).slice(0, 40) + ")", 6000);
}

function toast(msg, ms) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), ms || 2200);
}
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* عنصر عادي: { key, id, size, quantity } — والتركيب حسب الطلب: { key, id:"custom", size, quantity, custom:{...} } */
function loadCart() {
  try {
    const c = JSON.parse(lsGet("moonCart", "[]"));
    if (!Array.isArray(c)) return [];
    return c.map(i => {
      if (!i || !(i.quantity > 0)) return null;
      const size = (i.id === "custom" ? CUSTOM_PRICES : PRICES)[Number(i.size)] ? Number(i.size) : 50;
      if (i.id === "custom" && i.custom) return { key: i.key || ("custom|" + Date.now()), id: "custom", size, quantity: i.quantity, custom: i.custom };
      if (!products.some(p => p.id === i.id)) return null;
      return { key: i.id + "|" + size, id: i.id, size, quantity: i.quantity };
    }).filter(Boolean);
  } catch (e) { return []; }
}
let cart = loadCart();

function saveCart() { lsSet("moonCart", JSON.stringify(cart)); updateCartCount(); }
function updateCartCount() {
  document.getElementById("cartCount").textContent = cart.reduce((s, i) => s + i.quantity, 0);
}
function unitPrice(it) { return (it.id === "custom" ? CUSTOM_PRICES : PRICES)[it.size]; }
function addToCart(id, qty = 1, size = 50) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  size = PRICES[Number(size)] ? Number(size) : 50;
  const key = id + "|" + size;
  const ex = cart.find(i => i.key === key);
  if (ex) ex.quantity += qty; else cart.push({ key, id, size, quantity: qty });
  saveCart();
  trk("add_to_cart", { value: PRICES[size] * qty, currency: "EGP" });
  toast(t("addedToast", { name: p.name + " " + t("size" + size) }));
}
function changeCartQuantity(key, amt) {
  const it = cart.find(i => i.key === key);
  if (!it) return;
  it.quantity += amt;
  if (it.quantity <= 0) cart = cart.filter(i => i.key !== key);
  saveCart(); renderCart();
}
function removeFromCart(key) { cart = cart.filter(i => i.key !== key); saveCart(); renderCart(); }

function pLiked(id) { return lsGet("moonLikedP_" + id, "0") === "1"; }
function pLikeCount(id) { return Number(lsGet("moonLikeCountP_" + id, "0")) || 0; }
function pShareCount(id) { return Number(lsGet("moonShareCountP_" + id, "0")) || 0; }
function loadAllReviews() {
  try { const o = JSON.parse(lsGet("moonReviews", "{}")); return (o && typeof o === "object" && !Array.isArray(o)) ? o : {}; } catch (e) { return {}; }
}
const sharedReviews = {};
function loadReviews(id) {
  if (DB_ON) return sharedReviews[id] || [];
  const a = loadAllReviews()[id]; return Array.isArray(a) ? a : [];
}
async function fetchReviews(id) {
  try {
    const o = await dbReq("GET", "reviews/" + id);
    sharedReviews[id] = dbList(o).map(r => Object.assign(r, { rating: Math.min(5, Math.max(1, Math.round(Number(r.rating)) || 5)) }));
    if (currentView === "details" && currentProductId === id) {
      const a = document.getElementById("rvText"), b = document.getElementById("rvName");
      if (a && !a.value && !(b && b.value) && !ratingSel) renderDetails(id);
      else { const l = document.getElementById("pReviewList"); if (l) l.innerHTML = reviewListHtml(loadReviews(id)); }
    }
  } catch (e) { console.warn("fetchReviews failed", e); }
}
function saveReviews(id, arr) { const o = loadAllReviews(); o[id] = arr; lsSet("moonReviews", JSON.stringify(o)); }
function starsStatic(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

function reviewListHtml(rs) {
  if (!rs.length) return `<div class="no-comments">${t("rvNone")}</div>`;
  return rs.slice().reverse().map(r => `
    <div class="comment">
      <div class="comment-head">
        <strong>${escapeHtml(r.name || t("visitor"))}</strong>
        <span><small>${escapeHtml(new Date(r.ts).toLocaleDateString(locale(), { day: "numeric", month: "long", year: "numeric" }))}</small> ${DB_ON ? "" : `<button class="del" onclick="deleteReview('${currentProductId}',${Number(r.id)})">${t("remove")}</button>`}</span>
      </div>
      <div class="star-static">${starsStatic(r.rating)}</div>
      <p>${escapeHtml(r.text)}</p>
    </div>`).join("");
}

function setRating(n) {
  ratingSel = n;
  document.querySelectorAll("#starPicker .star").forEach((b, i) => b.classList.toggle("on", i < n));
}
async function postReview(e, id) {
  e.preventDefault();
  if (ratingSel < 1) { toast(t("rvPickStar")); return false; }
  const text = document.getElementById("rvText").value.trim();
  if (!text) return false;
  const name = document.getElementById("rvName").value.trim();
  if (!rateOk()) return false;
  const now = Date.now();
  const p = products.find(x => x.id === id);
  if (DB_ON) {
    const rec = { rating: ratingSel, text, ts: now }; if (name) rec.name = name;
    try {
      const r = await dbReq("POST", "reviews/" + id, rec);
      (sharedReviews[id] = sharedReviews[id] || []).push(Object.assign({ id: r.name }, rec));
    } catch (err) { postFailToast(err); return false; }
  } else {
    const rs = loadReviews(id);
    rs.push({ id: now, name, rating: ratingSel, text, ts: now });
    saveReviews(id, rs);
  }
  markPosted();
  notifyOwner("review", name || "زائر", `تقييم جديد لعطر ${p.name} - ${p.arabicName}: ${starsStatic(ratingSel)}\n${text}`);
  ratingSel = 0;
  renderDetails(id);
  toast(t("rvPosted"));
  return false;
}
function deleteReview(id, rid) {
  saveReviews(id, loadReviews(id).filter(r => r.id !== rid));
  renderDetails(id);
}

function paintPEngage(id) {
  if (currentProductId !== id || !document.getElementById("pLikeBtn")) return;
  document.getElementById("pLikeBtn").classList.toggle("liked", pLiked(id));
  document.getElementById("pLikeIcon").textContent = pLiked(id) ? "♥" : "♡";
  document.getElementById("pLikeCount").textContent = pLikeCount(id).toLocaleString(locale());
  document.getElementById("pShareCount").textContent = pShareCount(id).toLocaleString(locale());
}
async function togglePLike(id) {
  const now = !pLiked(id);
  lsSet("moonLikedP_" + id, now ? "1" : "0");
  lsSet("moonLikeCountP_" + id, Math.max(0, pLikeCount(id) + (now ? 1 : -1)));
  paintPEngage(id);
  try { lsSet("moonLikeCountP_" + id, await counter("like-" + id, now ? "up" : "down")); paintPEngage(id); } catch (e) {}
}
async function loadPCounts(id) {
  try { lsSet("moonLikeCountP_" + id, await counter("like-" + id, "")); } catch (e) {}
  try { lsSet("moonShareCountP_" + id, await counter("share-" + id, "")); } catch (e) {}
  paintPEngage(id);
}

async function sharePerfume(id, type) {
  const p = products.find(x => x.id === id);
  const title = `${p.name} · ${p.arabicName} — Moon Perfumes`;
  const url = perfumeURL(id);

}
function getDiscount() { const p = currentPromo(); return p ? Math.round(getCartSubtotal() * p.pct / 100) : 0; }
function getShipping() {
  if (!cart.length) return 0;
  if (FREE_SHIPPING_OVER > 0 && getCartSubtotal() - getDiscount() >= FREE_SHIPPING_OVER) return 0;

  return (g && SHIP_FEES[g] != null) ? SHIP_FEES[g] : SHIPPING_FEE;

/* عداد خارجي مجاني (counterapi.dev) للزوار وإعجابات الخبر */
const COUNTER_BASE = "https://api.counterapi.dev/v1/moonperfumes-cairo";
const ABACUS_BASE = "https://abacus.jasoncameron.dev";
async function counter(key, action) {
  try {
    const url = `${COUNTER_BASE}/${key}${action ? "/" + action : ""}`;
    const res = await withTimeout(fetch(url), 7000);
    if (!res.ok) throw new Error("counter " + res.status);
    const data = await res.json();
    const n = Number(data.count ?? data.Count);
    if (isNaN(n)) throw new Error("bad counter data");
    return n;
  } catch (e) {
    /* خدمة احتياطية لو الأولى مش شغالة */
    if (action === "down") throw e;
    const res = await withTimeout(fetch(`${ABACUS_BASE}/${action === "up" ? "hit" : "get"}/moonperfumes-cairo/${key}`), 7000);
    if (!res.ok) throw new Error("counter2 " + res.status);
    const data = await res.json();
    const n = Number(data.value);
    if (isNaN(n)) throw new Error("bad counter2 data");
    return n;
  }
}

const ST_STEPS = ["new", "confirmed", "shipped", "delivered"];
async function trackOrder(idArg) {
  const inp = document.getElementById("trackInput"), out = document.getElementById("trackResult");
  const id = String(idArg || inp.value || "").trim().toUpperCase();
  inp.value = id;
  const msg = (cls, k) => { out.innerHTML = `<p class="track-msg ${cls}">${t(k)}</p>`; };
  if (!/^MOON-\d{4,10}$/.test(id)) { msg("track-bad", "trackNone"); return; }
  if (!DB_ON) {
    out.innerHTML = `<p class="track-msg">${t("trackOff")}</p><a class="wa-link" href="https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("رقم طلبي: " + id)}" target="_blank" rel="noopener">${t("trackWa")}</a>`;
    return;
  }
  out.innerHTML = `<p class="track-msg">…</p>`;
  try {
    const o = await dbReq("GET", "orders/" + id);
    if (!o || typeof o.status !== "string") { msg("track-bad", "trackNone"); return; }
    if (o.status === "cancelled") { msg("track-bad", "st_cancelled"); return; }
    const idx = Math.max(0, ST_STEPS.indexOf(o.status));
    out.innerHTML = `<p class="track-msg"><b dir="ltr">${escapeHtml(id)}</b></p><ul class="track-steps">` +
      ST_STEPS.map((s, i) => `<li class="${i <= idx ? "done" : ""}${i === idx ? " now" : ""}">${i <= idx ? "✔ " : "○ "}${t("st_" + s)}</li>`).join("") + `</ul>`;
  } catch (e) { msg("track-bad", "trackErr"); }
}

/* =====================================================
   الفاتورة: عرض + طباعة (A4 / PDF / إيصال 80 أو 58 مم) + QR
   ===================================================== */
let currentInvoice = null, invMode = "a4";

function b64uEnc(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function b64uDec(str) {
  str = str.replace(/-/g, "+").replace(/_/g, "/");
  while (str.length % 4) str += "=";
  const bin = atob(str);
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function siteBase() {
  return SITE_URL || (/^https?:/.test(location.href) ? location.href.split(/[#?]/)[0] : "");
}
function buildOrderObject(orderId, c) {
  return {
    id: orderId, ts: Date.now(),
    name: c.name, phone: c.phone, email: c.email, address: c.address, notes: c.notes,
    items: cart.map(it => ({ id: it.id, size: it.size, qty: it.quantity, price: unitPrice(it), custom: it.id === "custom" ? it.custom : undefined })),
    shipping: getShipping(), discount: getDiscount(), promo: (currentPromo() || {}).code || "", pay: payMethod()
  };
}
/* الطلب بيتحول لنص صغير جوه الرابط نفسه (مفيش سيرفر) */
function encodeInvoiceData(o) {
  return b64uEnc(JSON.stringify({
    i: o.id, t: o.ts, n: o.name, p: o.phone, e: o.email, a: o.address, o: o.notes, s: o.shipping, d: o.discount || 0, c: o.promo || "", y: o.pay || "",
    it: o.items.map(x => x.custom
      ? [x.id, x.size, x.qty, x.price, { t: x.custom.target, f: x.custom.families, d: String(x.custom.details).slice(0, 300), l: x.custom.label }]
      : [x.id, x.size, x.qty, x.price])
  }));
}
function invoiceLink(o) {
  const base = siteBase();
  return base ? base + "#inv=" + encodeInvoiceData(o) : "";
}
function randToken(n) {
  const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789", u = new Uint8Array(n);
  crypto.getRandomValues(u);
  return Array.from(u, x => a[x % a.length]).join("");
}
/* رابط قصير: الفاتورة بتتحفظ في Firebase بكود عشوائي سري، والرابط بيبقى  ...#i=كود  . لو Firebase مش شغال بيرجع للرابط الطويل */
async function shortInvoiceLink(o) {
  const base = siteBase();
  if (!base) return "";
  if (DB_ON) {
    try {
      const tok = randToken(14);
      await dbReq("PUT", "invoices/" + tok, { d: encodeInvoiceData(o), ts: Date.now() });
      return base + "#i=" + tok;
    } catch (e) { console.warn("short invoice link failed, using long link", e); }
  }
  return invoiceLink(o);
}
async function openInvoiceByToken(tok) {
  if (!DB_ON || !/^[A-Za-z0-9]{10,24}$/.test(tok)) return;
  try {
    const r = await dbReq("GET", "invoices/" + tok);
    const o = r && typeof r.d === "string" ? parseInvoice(r.d) : null;
    if (o) openInvoice(o, "ar"); else toast(t("trackNone"));
  } catch (e) { toast(t("trackErr")); }
}
function logoUrl() { const b = siteBase(); return b ? b.replace(/[^\/]*$/, "") + "images/logo.png" : ""; }
/* اللي بيتحط جوه الـ QR: رابط تتبع الطلب (لو الموقع منشور) أو رابط واتساب برقم الطلب — مفيش بيانات شخصية */
function trackText(id) {
  const b = siteBase();
  return b ? b + "#track=" + encodeURIComponent(id) : "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent("رقم طلبي: " + id);
}
function qrImgUrl(orderId) { return "https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=0&data=" + encodeURIComponent(orderId); }

function parseInvoice(b64) {
  try {
    const c = JSON.parse(b64uDec(b64));
    const str = (v, n) => String(v == null ? "" : v).slice(0, n);
    if (!c || typeof c.i !== "string" || !/^[\w-]{1,30}$/.test(c.i) || !Array.isArray(c.it) || !c.it.length || c.it.length > 50) return null;
    const items = c.it.map(x => {
      if (!Array.isArray(x)) return null;
      const size = [50, 100].includes(Number(x[1])) ? Number(x[1]) : 50;
      const qty = Math.round(Number(x[2])), price = Number(x[3]);
      if (!(qty >= 1 && qty <= 999) || !(price >= 0 && price <= 100000)) return null;
      const it = { id: str(x[0], 20), size, qty, price };
      if (it.id === "custom") {
        const cu = x[4] || {};
        it.custom = {
          target: ["him", "her", "uni"].includes(cu.t) ? cu.t : "uni",
          families: (Array.isArray(cu.f) ? cu.f : []).filter(f => FAMILIES.includes(f)),
          details: str(cu.d, 800), label: str(cu.l, 30)
        };
      }
      return it;
    }).filter(Boolean);
    if (!items.length) return null;
    const ship = Number(c.s);
    return { id: c.i, ts: Number(c.t) || Date.now(), name: str(c.n, 80), phone: str(c.p, 30), email: str(c.e, 80), address: str(c.a, 400), notes: str(c.o, 600), items, shipping: ship >= 0 && ship <= 10000 ? ship : SHIPPING_FEE,
      discount: (Number(c.d) >= 0 && Number(c.d) <= 100000) ? Number(c.d) : 0, promo: str(c.c, 20), pay: ["cod", "insta", "vf", "orange", "etisalat", "we", "card"].includes(c.y) ? c.y : "" };
  } catch (e) { return null; }
}

function qrSvg(text) {
  const q = MoonQR.create(text), m = 2, n = q.count;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.dark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}

  const disc = o.discount || 0;

  el.innerHTML = `

      <div class="inv-brand" style="display:none">Moon · مون<small>PERFUMES · للعطور</small></div>

    </div>
    <div class="inv-meta">
      <div><b>${e(tl(l, "invNo"))}:</b> <span dir="ltr">${e(o.id)}</span></div>
      <div><b>${e(tl(l, "invDate"))}:</b> ${e(when)}</div>
      ${o.pay ? `<div><b>${e(tl(l, "lblPay"))}:</b> ${e(payName(l, o.pay))}</div>` : ""}
    </div>
    <div class="inv-box">
      <h4>${e(tl(l, "invCustomer"))}</h4>
      ${field("invName", o.name)}${field("invPhone", o.phone)}${field("invEmail", o.email)}${field("invAddr", o.address)}${field("invNotes", o.notes)}
    </div>
    <table class="inv-table">
      <thead><tr><th>${e(tl(l, "invItem"))}</th><th class="num">${e(tl(l, "invQty"))}</th><th class="num col-unit">${e(tl(l, "invUnit"))}</th><th class="num">${e(tl(l, "invTotalCol"))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="inv-totals">
      <div><span>${e(tl(l, "subtotalLabel"))}</span><span>${subtotal} ${e(egp)}</span></div>
      ${disc ? `<div><span>${e(tl(l, "discountLabel"))}${o.promo ? " (" + e(o.promo) + ")" : ""}</span><span>− ${disc} ${e(egp)}</span></div>` : ""}
      <div><span>${e(tl(l, "shipLabel"))}</span><span>${o.shipping} ${e(egp)}</span></div>
      <div class="final"><span>${e(tl(l, "totalLabel"))}</span><span>${total} ${e(egp)}</span></div>
    </div>
    <div class="inv-note">🚚 ${e(tl(l, "deliveryNote"))}</div>
    <div class="inv-foot">
      <div class="inv-qr">${qrSvg(trackText(o.id))}</div>
      <div class="oid" dir="ltr">${e(o.id)}</div>
      <div class="cap">${e(tl(l, "invScan"))}</div>
      <div>${e(tl(l, "invThanks"))}</div>
    </div>`;
}

  }

const IMG_EXTS = ["jpg", "png", "webp", "jpeg"];
function probeImg(base, k, done) {
  if (k >= IMG_EXTS.length) return done(null);
  const u = base + "." + IMG_EXTS[k], im = new Image();
  im.onload = () => done(u);
  im.onerror = () => probeImg(base, k + 1, done);
  im.src = u;
}
/* صورة لكل عطر: images/oud.jpg (والصور الإضافية oud-2.jpg و oud-3.jpg ...) */
products.forEach(p => {

  });
});
