<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moon Perfumes | عطور مون</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Aref+Ruqaa:wght@400;700&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--black:#090909;--gold:#c9a227;--gold-light:#e4c65a;--border:rgba(201,162,39,.25)}
body{font-family:Arial,Tahoma,sans-serif;background:var(--black);color:#fff;line-height:1.8}
button,input,textarea,select{font-family:inherit}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:1000;background:rgba(9,9,9,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.navbar{max-width:1200px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.nav-right{display:flex;align-items:center;gap:10px}
.lang-select{background:#141414;color:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px;outline:none}
.lang-select:focus{border-color:var(--gold)}
nav{display:flex;gap:25px;align-items:center}
nav button{background:none;border:none;color:#fff;cursor:pointer;font-size:15px;transition:.3s}
nav button:hover{color:var(--gold-light)}
.cart-button{position:relative;background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 15px;border-radius:8px;cursor:pointer}
.cart-count{position:absolute;top:-9px;inset-inline-end:-9px;width:22px;height:22px;background:var(--gold);color:#000;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.view{display:none}.view.active{display:block}
.hero{min-height:560px;display:flex;align-items:center;justify-content:center;text-align:center;padding:80px 20px;background:radial-gradient(circle at center,rgba(9,9,9,.55),rgba(9,9,9,.9) 75%),var(--sheet,none) center/cover no-repeat,#090909}
.wordmark{display:flex;flex-direction:column;align-items:center;margin-bottom:12px}
.wm-hiero{font-family:'Noto Sans Egyptian Hieroglyphs','Segoe UI Historic',serif;color:var(--gold);font-size:clamp(30px,5vw,46px);letter-spacing:14px;line-height:1.3}
.wm-en{font-family:'Playfair Display',Georgia,serif;font-size:clamp(64px,12vw,125px);color:var(--gold);line-height:1;font-weight:500;letter-spacing:2px}
.wm-ar{font-family:'Aref Ruqaa','Reem Kufi',Tahoma,serif;font-size:clamp(52px,9vw,95px);color:var(--gold);line-height:1.15}
.wm-sub{display:flex;gap:20px;align-items:center;color:var(--gold-light);margin-top:6px}
.wm-sub::before,.wm-sub::after{content:"";width:50px;height:1px;background:var(--gold)}
.wm-sub .p{font-family:'Playfair Display',Georgia,serif;letter-spacing:9px;font-size:16px}
.wm-sub .a{font-family:'Aref Ruqaa',Tahoma,serif;font-size:22px}
.logo{display:flex;align-items:center;gap:8px;font-weight:bold;color:var(--gold);cursor:pointer}
.logo .lg-h{font-family:'Noto Sans Egyptian Hieroglyphs','Segoe UI Historic',serif;font-size:22px}
.logo .lg-e{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:600}
.logo .lg-a{font-family:'Aref Ruqaa',Tahoma,serif;font-size:24px}
.socials{display:flex;gap:14px;justify-content:center;margin-top:22px}
.socials a{width:46px;height:46px;border:1px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold);transition:.3s}
.socials a:hover{background:var(--gold);color:#000;transform:translateY(-3px)}
.socials svg{width:22px;height:22px}
.address{margin-top:22px;color:#ddd}
.address strong{color:var(--gold)}
.about{max-width:1000px;margin:0 auto;padding:70px 20px 10px;display:grid;grid-template-columns:320px 1fr;gap:45px;align-items:center}
.about-logo{background:#f8efdc;border-radius:16px;padding:12px;border:1px solid var(--gold);box-shadow:0 15px 40px rgba(201,162,39,.15)}
.about-logo img{width:100%;display:block;border-radius:8px}
.about-text h2{color:var(--gold);font-size:32px;margin-bottom:12px}
.about-text p{color:#ccc;font-size:16px;margin-bottom:10px}
@media(max-width:800px){.about{grid-template-columns:1fr;text-align:center}.about-logo{max-width:300px;margin:auto}}
.showcase{max-width:1100px;margin:0 auto;padding:10px 20px 0}
.showcase img{width:100%;border-radius:16px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(201,162,39,.15);display:block}
.hero-content{max-width:800px}
.hero p{color:#ccc;max-width:600px;margin:auto;font-size:17px}
.gold-button{display:inline-block;margin-top:30px;padding:13px 30px;background:var(--gold);color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;transition:.3s;font-size:15px}
.gold-button:hover{background:var(--gold-light);transform:translateY(-2px)}
.gold-button:disabled{opacity:.6;cursor:wait;transform:none}
.section{max-width:1200px;margin:auto;padding:70px 20px}
.section-title{text-align:center;color:var(--gold);font-size:35px;margin-bottom:45px}
.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.product-card{background:linear-gradient(145deg,#151515,#0c0c0c);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.3s}
.product-card:hover{transform:translateY(-6px);border-color:var(--gold);box-shadow:0 15px 40px rgba(201,162,39,.12)}
.crop{width:100%;height:100%;background-repeat:no-repeat;background-size:300% 200%}
.product-image{aspect-ratio:352/496;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(201,162,39,.13),transparent 55%),#101010;cursor:pointer;position:relative;overflow:hidden}
.product-image img,.details-image img{width:100%;height:100%;object-fit:cover}
.image-placeholder{width:150px;height:220px;border:2px solid var(--gold);border-radius:45px 45px 30px 30px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:20px;position:relative}
.image-placeholder::before{content:"";position:absolute;top:-35px;width:70px;height:38px;border:2px solid var(--gold);border-bottom:none;border-radius:10px 10px 0 0}
.product-info{padding:22px}
.product-name{font-size:25px;color:var(--gold);margin-bottom:5px}
.product-arabic{color:#ccc;margin-bottom:10px}
.product-price{font-size:22px;font-weight:bold;margin-bottom:12px}
.product-description{color:#aaa;font-size:14px;min-height:50px;margin-bottom:18px}
.product-actions{display:flex;gap:10px}
.details-btn,.add-btn{flex:1;padding:11px;border-radius:7px;cursor:pointer;font-weight:bold}
.details-btn{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.add-btn{background:var(--gold);color:#000;border:1px solid var(--gold)}
.details-container{max-width:1100px;margin:auto;padding:60px 20px}
.back-btn{background:transparent;border:1px solid #555;color:#fff;padding:9px 18px;border-radius:7px;cursor:pointer;margin-bottom:30px}
.product-details{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.details-image{aspect-ratio:352/496;width:100%;max-width:440px;margin:auto;border:1px solid var(--border);border-radius:15px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(201,162,39,.13),transparent 55%),#101010;overflow:hidden}
.details-info h1{color:var(--gold);font-size:45px;margin-bottom:5px}
.details-info h2{color:#ccc;font-weight:normal;margin-bottom:15px}
.details-price{font-size:28px;font-weight:bold;margin-bottom:20px}
.details-description{color:#bbb;margin-bottom:25px}
.notes-box{border:1px solid var(--border);border-radius:10px;margin-bottom:25px;overflow:hidden}
.note-row{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.note-row:last-child{border-bottom:none}
.note-row strong{color:var(--gold);display:block;margin-bottom:3px}
.quantity-control{display:flex;align-items:center;gap:15px;margin:20px 0}
.quantity-control button{width:38px;height:38px;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:6px;cursor:pointer;font-size:20px}
.quantity-control span{min-width:35px;text-align:center;font-size:20px}
.cart-container,.checkout-container,.contact-container{max-width:900px;margin:auto;padding:60px 20px}
.cart-item{display:flex;align-items:center;gap:20px;padding:20px 0;border-bottom:1px solid #292929}
.cart-item-image{width:90px;height:110px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.cart-item-image img{width:100%;height:100%;object-fit:cover}
.mini-bottle{width:35px;height:60px;border:1px solid var(--gold);border-radius:15px}
.cart-item-info{flex:1}
.cart-item-info h3{color:var(--gold)}
.cart-quantity{display:flex;align-items:center;gap:8px}
.cart-quantity button{width:30px;height:30px;background:transparent;color:#fff;border:1px solid #555;cursor:pointer;border-radius:5px}
.remove-btn{background:transparent;color:#d66;border:none;cursor:pointer}
.totals{border-top:1px solid #292929;margin-top:10px;padding:18px 0 10px}
.p-extra{max-width:850px;margin:50px auto 0}
.stars{display:inline-flex;gap:2px;direction:ltr;vertical-align:middle}
.star{background:none;border:none;color:#555;font-size:30px;cursor:pointer;line-height:1;padding:0 2px;transition:.2s}
.star.on,.star:hover{color:var(--gold)}
.star-static{color:var(--gold);letter-spacing:2px;direction:ltr;display:inline-block}
.rv-sum{color:#bbb;font-size:15px;margin-bottom:14px}
.rv-note{color:#777;font-size:12px;margin:2px 0 16px}
.rating-row{display:flex;align-items:center;gap:10px;color:#ccc}
.tot-row{display:flex;justify-content:space-between;gap:16px;padding:5px 0;color:#ddd;font-size:17px}
.tot-note{background:rgba(201,162,39,.1);border:1px solid var(--border);border-radius:8px;padding:8px 14px;margin:10px 0;color:var(--gold-light);font-size:14px}
.tot-final{color:var(--gold);font-size:25px;font-weight:bold;border-top:1px solid #292929;margin-top:6px;padding-top:12px}
.cart-total{text-align:end;font-size:25px;color:var(--gold);font-weight:bold;padding:30px 0}
.empty-cart{text-align:center;color:#aaa;padding:80px 20px}
.form-group{margin-bottom:18px}
.form-group label{display:block;margin-bottom:7px;color:var(--gold)}
.form-group input,.form-group textarea{width:100%;background:#141414;border:1px solid #333;color:#fff;border-radius:7px;padding:13px;outline:none;font-size:15px}
.form-group input:focus,.form-group textarea:focus{border-color:var(--gold)}
textarea{min-height:120px;resize:vertical}
.checkout-summary{background:#141414;padding:20px;border-radius:10px;border:1px solid var(--border);margin:25px 0}
.contact-box{background:#141414;border:1px solid var(--border);padding:30px;border-radius:12px;text-align:center}
.wa-link{display:inline-block;margin-top:20px;padding:12px 28px;background:#25d366;color:#000;border-radius:8px;font-weight:bold}
footer{border-top:1px solid var(--border);padding:30px 20px;text-align:center;color:#888;margin-top:50px}
footer strong{color:var(--gold)}
.visits{margin-top:20px;font-size:22px;font-weight:bold;color:#fff}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--gold);color:#000;padding:12px 24px;border-radius:8px;font-weight:bold;z-index:3000;opacity:0;transition:.35s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.success-box{text-align:center;padding:60px 20px}
.success-box h2{color:var(--gold);margin-bottom:12px}
.news-page{max-width:850px;margin:auto;padding:50px 20px}
.news-tag{display:inline-block;background:var(--gold);color:#000;font-weight:bold;font-size:13px;padding:3px 14px;border-radius:20px;margin-bottom:14px}
.news-title{color:var(--gold);font-size:clamp(26px,5vw,40px);line-height:1.5;margin-bottom:10px}
.news-meta{color:#888;font-size:14px;margin-bottom:25px}
.news-hero{width:100%;border-radius:16px;border:1px solid var(--border);box-shadow:0 20px 60px rgba(201,162,39,.15);display:block;margin-bottom:8px}
.news-caption{color:#888;font-size:13px;text-align:center;margin-bottom:28px}
.news-body p{color:#ddd;font-size:17px;margin-bottom:18px;line-height:2}
.news-body h3{color:var(--gold);margin:30px 0 12px;font-size:24px}
.news-body .news-lead{font-size:19px;color:#fff;border-inline-start:4px solid var(--gold);padding-inline-start:16px}
.news-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:15px 0 25px}
.news-list div{background:#141414;border:1px solid var(--border);border-radius:10px;padding:12px 16px}
.news-list strong{color:var(--gold);display:block}
.news-list span{color:#bbb;font-size:14px;line-height:1.7;display:block}
.news-points{list-style:none;margin:10px 0 22px}
.news-points li{color:#ddd;font-size:16px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.news-points li::before{content:"✦ ";color:var(--gold)}
.engage{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px 0;margin:30px 0}
.eng-btn{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:8px 16px;border-radius:22px;cursor:pointer;font-size:14px;transition:.3s;display:inline-block}
.eng-btn:hover{background:var(--gold);color:#000}
.eng-btn.liked{background:var(--gold);color:#000}
.share-label{color:#999;font-size:14px;margin-inline-start:auto}
.comments-box h3{color:var(--gold);margin-bottom:16px}
.comment-form{display:grid;gap:10px;margin-bottom:22px}
.comment-form input,.comment-form textarea{background:#141414;border:1px solid #333;color:#fff;border-radius:7px;padding:12px;font-size:15px;outline:none;width:100%}
.comment-form input:focus,.comment-form textarea:focus{border-color:var(--gold)}
.comment-form textarea{min-height:90px}
.comment-form .gold-button{margin-top:0;justify-self:start}
.comment{background:#141414;border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.comment-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.comment-head strong{color:var(--gold)}
.comment-head small{color:#777}
.comment p{color:#ddd;white-space:pre-line;word-break:break-word}
.comment .del{background:none;border:none;color:#d66;cursor:pointer;font-size:12px}
.no-comments{color:#888;text-align:center;padding:20px 0}
.visits strong{color:var(--gold);font-size:38px;margin:0 8px;letter-spacing:1px;vertical-align:middle}
@media(max-width:900px){.products-grid{grid-template-columns:repeat(2,1fr)}.product-details{grid-template-columns:1fr}.details-image{max-width:360px}}
@media(max-width:650px){.navbar{flex-wrap:wrap}nav{order:3;width:100%;justify-content:center;gap:15px}.products-grid{grid-template-columns:1fr}.hero{min-height:430px}.cart-item{flex-wrap:wrap}.details-info h1{font-size:35px}.news-list{grid-template-columns:1fr}.share-label{margin-inline-start:0;width:100%}}

.navbar{position:relative}
.hamburger{background:transparent;border:1px solid var(--gold);border-radius:8px;width:44px;height:40px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.hamburger span{display:block;width:22px;height:2px;background:var(--gold);transition:.3s}
.hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.hamburger.open span:nth-child(2){opacity:0}
.hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.menu-panel{position:absolute;top:100%;inset-inline-end:20px;min-width:240px;background:#0f0f0f;border:1px solid var(--gold);border-radius:12px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.7);display:none;z-index:1100}
.menu-panel.open{display:block}
.menu-panel button{display:block;width:100%;text-align:start;background:none;border:none;color:#fff;padding:12px 14px;border-radius:8px;cursor:pointer;font-size:16px}
.menu-panel button:hover,.menu-panel button.current{background:rgba(201,162,39,.15);color:var(--gold-light)}
.subnav{border-top:1px solid var(--border);background:rgba(15,15,15,.98);display:flex;align-items:center;gap:12px;padding:9px 16px;overflow:hidden}
.sub-label{color:var(--gold);font-size:13px;font-weight:bold;white-space:nowrap;flex-shrink:0}
.marquee{flex:1;overflow:hidden;direction:ltr;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.marquee-track{display:flex;width:max-content;animation:marq 45s linear infinite}
.marquee:hover .marquee-track,.marquee:focus-within .marquee-track,.marquee:active .marquee-track{animation-play-state:paused}
.mq-half{display:flex;flex:none}
.mq-half button{flex:none;margin-right:10px;background:transparent;border:1px solid var(--border);color:#fff;padding:5px 16px;border-radius:20px;cursor:pointer;font-size:13px;white-space:nowrap;transition:.3s}
.mq-half button:hover{border-color:var(--gold);color:var(--gold-light)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.marquee-track{animation:none}.marquee{overflow-x:auto}}
.gender-tag{display:inline-block;font-size:11px;letter-spacing:2px;border:1px solid var(--gold);color:var(--gold);border-radius:20px;padding:0 10px;margin-bottom:8px}
.size-picker{display:flex;gap:8px;margin:10px 0 14px;flex-wrap:wrap}
.size-pill{flex:1;min-width:110px;background:transparent;border:1px solid #444;color:#ddd;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:13px;line-height:1.5;transition:.3s;text-align:center}
.size-pill b{display:block;color:var(--gold);font-size:15px}
.size-pill:hover{border-color:var(--gold)}
.size-pill.active{border-color:var(--gold);background:rgba(201,162,39,.15);color:#fff}
.cat-intro{text-align:center;color:#bbb;max-width:700px;margin:-20px auto 25px}
.cat-tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:-15px 0 35px}
.cat-tabs button{background:transparent;border:1px solid var(--border);color:#fff;padding:7px 18px;border-radius:22px;cursor:pointer;font-size:14px;transition:.3s}
.cat-tabs button:hover{border-color:var(--gold);color:var(--gold-light)}
.custom-page{max-width:800px;margin:auto;padding:60px 20px}
.custom-box{background:#141414;border:1px solid var(--border);border-radius:14px;padding:26px}
.field-select{width:100%;background:#0e0e0e;border:1px solid #333;color:#fff;border-radius:7px;padding:13px;font-size:15px;outline:none}
.field-select:focus{border-color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid #444;color:#ddd;border-radius:20px;padding:6px 16px;cursor:pointer;font-size:14px;transition:.3s}
.chip:hover{border-color:var(--gold)}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:bold}
.custom-total{font-size:22px;color:var(--gold);font-weight:bold;margin:8px 0 4px}
.cart-item-info small{color:#999;display:block;white-space:pre-line;font-size:13px;line-height:1.6;margin:3px 0}
.newsletter{max-width:560px;margin:0 auto 28px}
.newsletter h3{color:var(--gold);font-size:22px;margin-bottom:4px}
.newsletter p{color:#aaa;margin-bottom:12px;font-size:14px}
.newsletter form{display:flex;gap:8px}
.newsletter input{flex:1;min-width:0;background:#141414;border:1px solid #333;color:#fff;border-radius:8px;padding:12px;font-size:15px;outline:none}
.newsletter input:focus{border-color:var(--gold)}
.newsletter .gold-button{margin-top:0;padding:12px 22px}
@media(max-width:650px){.menu-panel{inset-inline-end:12px}.newsletter form{flex-direction:column}}
</style>
</head>
<body>

<header>
  <div class="navbar">
    <div class="logo" onclick="showView('home')"><span class="lg-h">𓂀</span><span class="lg-e">Moon</span><span class="lg-a">مون</span></div>
    <nav>
      <button onclick="showView('home')" data-i18n="navHome"></button>
      <button onclick="showView('products')" data-i18n="navPerfumes"></button>
      <button onclick="showView('news')" data-i18n="navNews"></button>
      <button onclick="showView('contact')" data-i18n="navContact"></button>
    </nav>
    <div class="nav-right">
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="es">Español</option>
      </select>
      <button class="cart-button" onclick="showView('cart')"><span data-i18n="cartLabel"></span> <span class="cart-count" id="cartCount">0</span></button>
      <button class="hamburger" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menuPanel"><span></span><span></span><span></span></button>
    </div>
    <div class="menu-panel" id="menuPanel" role="menu"></div>
  </div>
  <div class="subnav" id="subNav"></div>
</header>

<section id="home" class="view active">
  <div class="hero">
    <div class="hero-content">
      <div class="wordmark">
        <div class="wm-hiero">𓅃 𓂀 𓋹</div>

function toast(msg) {

  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}
function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
}
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function escapeHtml(s) {

}

/* عنصر عادي: { key, id, size, quantity } — والتركيب حسب الطلب: { key, id:"custom", size, quantity, custom:{...} } */
function loadCart() {
  try {
    const c = JSON.parse(lsGet("moonCart", "[]"));
    if (!Array.isArray(c)) return [];
    return c.map(i => {
      if (!i || !(i.quantity > 0)) return null;
      const size = Number(i.size) === 100 ? 100 : 50;
      if (i.id === "custom" && i.custom) return { key: i.key || ("custom|" + Date.now()), id: "custom", size, quantity: i.quantity, custom: i.custom };
      if (!products.some(p => p.id === i.id)) return null;
      return { key: i.id + "|" + size, id: i.id, size, quantity: i.quantity };
    }).filter(Boolean);
  } catch (e) { return []; }
}
let cart = loadCart();

function saveCart() { lsSet("moonCart", JSON.stringify(cart)); updateCartCount(); }
function updateCartCount() {
  document.getElementById("cartCount").textContent = cart.reduce((s, i) => s + i.quantity, 0);
}
function unitPrice(it) { return (it.id === "custom" ? CUSTOM_PRICES : PRICES)[it.size]; }
function addToCart(id, qty = 1, size = 50) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  size = Number(size) === 100 ? 100 : 50;
  const key = id + "|" + size;
  const ex = cart.find(i => i.key === key);
  if (ex) ex.quantity += qty; else cart.push({ key, id, size, quantity: qty });
  saveCart();
  toast(t("addedToast", { name: p.name + " " + t("size" + size) }));
}
function changeCartQuantity(key, amt) {
  const it = cart.find(i => i.key === key);
  if (!it) return;
  it.quantity += amt;
  if (it.quantity <= 0) cart = cart.filter(i => i.key !== key);
  saveCart(); renderCart();
}
function removeFromCart(key) { cart = cart.filter(i => i.key !== key); saveCart(); renderCart(); }

/* ===== إعجاب / مشاركة / تقييمات لكل عطر ===== */
function pLiked(id) { return lsGet("moonLikedP_" + id, "0") === "1"; }
function pLikeCount(id) { return Number(lsGet("moonLikeCountP_" + id, "0")) || 0; }
function pShareCount(id) { return Number(lsGet("moonShareCountP_" + id, "0")) || 0; }
function loadAllReviews() {
  try { const o = JSON.parse(lsGet("moonReviews", "{}")); return (o && typeof o === "object" && !Array.isArray(o)) ? o : {}; } catch (e) { return {}; }
}
function loadReviews(id) { const a = loadAllReviews()[id]; return Array.isArray(a) ? a : []; }
function saveReviews(id, arr) { const o = loadAllReviews(); o[id] = arr; lsSet("moonReviews", JSON.stringify(o)); }
function starsStatic(n) { return "★".repeat(n) + "☆".repeat(5 - n); }

function reviewListHtml(rs) {
  if (!rs.length) return `<div class="no-comments">${t("rvNone")}</div>`;
  return rs.slice().reverse().map(r => `
    <div class="comment">
      <div class="comment-head">
        <strong>${escapeHtml(r.name || t("visitor"))}</strong>
        <span><small>${escapeHtml(new Date(r.ts).toLocaleDateString(locale(), { day: "numeric", month: "long", year: "numeric" }))}</small> <button class="del" onclick="deleteReview('${currentProductId}',${Number(r.id)})">${t("remove")}</button></span>
      </div>
      <div class="star-static">${starsStatic(r.rating)}</div>
      <p>${escapeHtml(r.text)}</p>
    </div>`).join("");
}

function perfumeExtras(p) {
  const id = p.id, rs = loadReviews(id), liked = pLiked(id);
  const avg = rs.length ? rs.reduce((a, r) => a + r.rating, 0) / rs.length : 0;
  return `<div class="p-extra">
    <div class="engage">
      <button id="pLikeBtn" class="eng-btn${liked ? " liked" : ""}" onclick="togglePLike('${id}')"><span id="pLikeIcon">${liked ? "♥" : "♡"}</span> ${t("likeLabel")} (<b id="pLikeCount">${pLikeCount(id).toLocaleString(locale())}</b>)</button>
      <a class="eng-btn" href="#pReviews" onclick="document.getElementById('pReviews').scrollIntoView({behavior:'smooth'});return false">💬 ${t("commentsLink")} (${rs.length})</a>
      <span class="share-label">${t("shareLabel")}</span>
      <button class="eng-btn" onclick="sharePerfume('${id}','wa')">WhatsApp</button>
      <button class="eng-btn" onclick="sharePerfume('${id}','fb')">Facebook</button>
      <button class="eng-btn" onclick="sharePerfume('${id}','copy')">${t("shareCopy")}</button>
      <span class="share-label" style="margin:0">${t("sharesLabel")} <b id="pShareCount">${pShareCount(id).toLocaleString(locale())}</b></span>
    </div>
    <div class="comments-box" id="pReviews">
      <h3>${t("reviewsTitle")} (${rs.length})</h3>
      ${rs.length ? `<div class="rv-sum"><span class="star-static">${starsStatic(Math.round(avg))}</span> ${t(rs.length === 1 ? "rvAvgOne" : "rvAvg", { avg: avg.toFixed(1), n: rs.length })}</div>` : ""}
      <form class="comment-form" onsubmit="return postReview(event,'${id}')">
        <div class="rating-row"><span>${t("yourRating")}</span><span class="stars" id="starPicker">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star${n <= ratingSel ? " on" : ""}" onclick="setRating(${n})" aria-label="${n}">★</button>`).join("")}</span></div>
        <input type="text" id="rvName" maxlength="40" placeholder="${t("phCName")}">
        <textarea id="rvText" maxlength="600" required placeholder="${t("rvPh")}"></textarea>
        <button type="submit" class="gold-button">${t("rvPost")}</button>
      </form>
      <div class="rv-note">${t("rvNote")}</div>
      <div id="pReviewList">${reviewListHtml(rs)}</div>
    </div>
  </div>`;
}

function setRating(n) {
  ratingSel = n;
  document.querySelectorAll("#starPicker .star").forEach((b, i) => b.classList.toggle("on", i < n));
}
function postReview(e, id) {
  e.preventDefault();
  if (ratingSel < 1) { toast(t("rvPickStar")); return false; }
  const text = document.getElementById("rvText").value.trim();
  if (!text) return false;
  const name = document.getElementById("rvName").value.trim();
  const rs = loadReviews(id);
  const now = Date.now();
  rs.push({ id: now, name, rating: ratingSel, text, ts: now });
  saveReviews(id, rs);
  const p = products.find(x => x.id === id);
  notifyOwner("review", name || "زائر", `تقييم جديد لعطر ${p.name} - ${p.arabicName}: ${starsStatic(ratingSel)}\n${text}`);
  ratingSel = 0;
  renderDetails(id);
  toast(t("rvPosted"));
  return false;
}
function deleteReview(id, rid) {
  saveReviews(id, loadReviews(id).filter(r => r.id !== rid));
  renderDetails(id);
}

function paintPEngage(id) {
  if (currentProductId !== id || !document.getElementById("pLikeBtn")) return;
  document.getElementById("pLikeBtn").classList.toggle("liked", pLiked(id));
  document.getElementById("pLikeIcon").textContent = pLiked(id) ? "♥" : "♡";
  document.getElementById("pLikeCount").textContent = pLikeCount(id).toLocaleString(locale());
  document.getElementById("pShareCount").textContent = pShareCount(id).toLocaleString(locale());
}
async function togglePLike(id) {
  const now = !pLiked(id);
  lsSet("moonLikedP_" + id, now ? "1" : "0");
  lsSet("moonLikeCountP_" + id, Math.max(0, pLikeCount(id) + (now ? 1 : -1)));
  paintPEngage(id);
  try { lsSet("moonLikeCountP_" + id, await counter("like-" + id, now ? "up" : "down")); paintPEngage(id); } catch (e) {}
}
async function loadPCounts(id) {
  try { lsSet("moonLikeCountP_" + id, await counter("like-" + id, "")); } catch (e) {}
  try { lsSet("moonShareCountP_" + id, await counter("share-" + id, "")); } catch (e) {}
  paintPEngage(id);
}
function perfumeURL(id) { return location.href.split("#")[0] + "#p-" + id; }
async function sharePerfume(id, type) {
  const p = products.find(x => x.id === id);
  const title = `${p.name} · ${p.arabicName} — Moon Perfumes`;
  const url = perfumeURL(id);
  lsSet("moonShareCountP_" + id, pShareCount(id) + 1);
  paintPEngage(id);
  counter("share-" + id, "up").then(n => { lsSet("moonShareCountP_" + id, n); paintPEngage(id); }).catch(() => {});
  if (type === "wa") window.open("https://wa.me/?text=" + encodeURIComponent(title + "\n" + url), "_blank", "noopener");
  else if (type === "fb") window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url), "_blank", "noopener");
  else if (type === "copy") {
    const done = () => toast(t("copied"));
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => prompt(t("copyPrompt"), url));
    else prompt(t("copyPrompt"), url);
  }
}

  }
  const items = cart.map(it => {
    const isC = it.id === "custom";
    const p = isC ? null : products.find(x => x.id === it.id);
    const img = (!isC && (sheetOk || own[p.id])) ? productImage(p) : `<div class="mini-bottle"></div>`;
    const name = isC ? t("customTitle") : p.name;
    const sub = isC ? `<small>${escapeHtml(customSummary(it, lang))}</small>` : `<p>${p.arabicName}</p>`;
    const price = unitPrice(it);
    return `
      <div class="cart-item">
        <div class="cart-item-image">${img}</div>
        <div class="cart-item-info">
          <h3>${name} · ${t("size" + it.size)}</h3>${sub}<p>${price} ${t("egp")} × ${it.quantity}</p>
        </div>
        <div class="cart-quantity">
          <button onclick="changeCartQuantity('${it.key}',-1)">−</button>
          <span>${it.quantity}</span>
          <button onclick="changeCartQuantity('${it.key}',1)">+</button>
        </div>
        <strong style="color:#c9a227">${price * it.quantity} ${t("egp")}</strong>
        <button class="remove-btn" onclick="removeFromCart('${it.key}')">${t("remove")}</button>
      </div>`;
  }).join("");
  c.innerHTML = `${items}${totalsHtml()}
    <button class="gold-button" onclick="showView('checkout')">${t("checkoutBtn")}</button>`;
}

/* ========= Checkout ========= */
function getCartSubtotal() {
  return cart.reduce((sum, it) => sum + unitPrice(it) * it.quantity, 0);
}
function getShipping() { return cart.length ? SHIPPING_FEE : 0; }
function getCartTotal() { return getCartSubtotal() + getShipping(); }   /* شامل الشحن */
function totalsHtml() {
  const sub = getCartSubtotal(), ship = getShipping();
  return `<div class="totals">
    <div class="tot-row"><span>${t("subtotalLabel")}</span><span>${sub} ${t("egp")}</span></div>
    <div class="tot-row"><span>${t("shipLabel")}</span><span>${ship} ${t("egp")}</span></div>
    <div class="tot-note">🚚 ${t("deliveryNote")}</div>
    <div class="tot-row tot-final"><span>${t("totalLabel")}</span><span>${sub + ship} ${t("egp")}</span></div>
  </div>`;
}
function totalsText(l) {
  return `${tl(l, "subtotalLabel")} ${getCartSubtotal()} ${tl(l, "egp")}\n${tl(l, "shipLabel")} ${getShipping()} ${tl(l, "egp")}\n${tl(l, "deliveryNote")}`;
}
/* l = لغة النص. للعميل: لغته الحالية — وللإيميل وواتساب بتوصل لصاحب المتجر: دايمًا "ar" */
function buildOrder(l) {
  return cart.map(it => {
    const isC = it.id === "custom";
    const p = isC ? null : products.find(x => x.id === it.id);
    const price = unitPrice(it);
    const head = isC ? tl(l, "customTitle") : `${p.name} - ${p.arabicName}`;
    const extra = isC ? "\n" + customSummary(it, l) : "";
    return `${head}${extra}\n${tl(l, "lblSize")} ${tl(l, "size" + it.size)}\n${tl(l, "qtyLabel")} ${it.quantity}\n${tl(l, "priceLabel")} ${price} ${tl(l, "egp")}\n${tl(l, "totalLabel")} ${price * it.quantity} ${tl(l, "egp")}\n`;
  }).join("\n");
}
function getOrderDetails() { return buildOrder(lang); }
function getOrderDetailsAr() { return buildOrder("ar"); }
function renderCheckout() {
  const box = document.getElementById("checkoutSummary");
  if (cart.length === 0) {
    box.innerHTML = `<p>${t("checkoutEmpty")} <a href="#" onclick="showView('products');return false" style="color:#c9a227">${t("browse")}</a></p>`;
    return;
  }
  box.innerHTML = `<h3 style="color:#c9a227;margin-bottom:15px">${t("orderSummary")}</h3>
    <p style="white-space:pre-line">${getOrderDetails()}</p>
    ${totalsHtml()}`;
}

/* عداد خارجي مجاني (counterapi.dev) للزوار وإعجابات الخبر */
const COUNTER_BASE = "https://api.counterapi.dev/v1/moonperfumes-cairo";
const ABACUS_BASE = "https://abacus.jasoncameron.dev";
async function counter(key, action) {
  try {
    const url = `${COUNTER_BASE}/${key}${action ? "/" + action : ""}`;
    const res = await withTimeout(fetch(url), 7000);
    if (!res.ok) throw new Error("counter " + res.status);
    const data = await res.json();
    const n = Number(data.count ?? data.Count);
    if (isNaN(n)) throw new Error("bad counter data");
    return n;
  } catch (e) {
    /* خدمة احتياطية لو الأولى مش شغالة */
    if (action === "down") throw e;
    const res = await withTimeout(fetch(`${ABACUS_BASE}/${action === "up" ? "hit" : "get"}/moonperfumes-cairo/${key}`), 7000);
    if (!res.ok) throw new Error("counter2 " + res.status);
    const data = await res.json();
    const n = Number(data.value);
    if (isNaN(n)) throw new Error("bad counter2 data");
    return n;
  }
}

/* --- الإعجابات --- */
let liked = lsGet("moonNewsLiked", "0") === "1";
let likeCount = Number(lsGet("moonNewsLikesCache", "0")) || 0;
function paintLike() {
  document.getElementById("likeCount").textContent = likeCount.toLocaleString(locale());
  document.getElementById("newsShareCount").textContent = (Number(lsGet("moonNewsSharesCache", "0")) || 0).toLocaleString(locale());
  document.getElementById("likeIcon").textContent = liked ? "♥" : "♡";
  document.getElementById("likeBtn").classList.toggle("liked", liked);
}
async function initLikes() {
  paintLike();
  try { likeCount = await counter("news1-likes", ""); lsSet("moonNewsLikesCache", likeCount); paintLike(); } catch (e) {}
  try { const n = await counter("news1-shares", ""); lsSet("moonNewsSharesCache", n); paintLike(); } catch (e) {}
}
async function bumpNewsShare() {
  lsSet("moonNewsSharesCache", (Number(lsGet("moonNewsSharesCache", "0")) || 0) + 1);
  paintLike();
  try { const n = await counter("news1-shares", "up"); lsSet("moonNewsSharesCache", n); paintLike(); } catch (e) {}
}
async function toggleLike() {
  liked = !liked;
  likeCount = Math.max(0, likeCount + (liked ? 1 : -1));
  lsSet("moonNewsLiked", liked ? "1" : "0");
  lsSet("moonNewsLikesCache", likeCount);
  paintLike();
  try { likeCount = await counter("news1-likes", liked ? "up" : "down"); lsSet("moonNewsLikesCache", likeCount); paintLike(); } catch (e) {}
}

/* --- المشاركة --- */
function newsURL() { return location.href.split("#")[0] + "#news"; }
function shareNews(type) {
  bumpNewsShare();
  const title = t("newsTitle");
  const url = newsURL();
  if (type === "wa") window.open("https://wa.me/?text=" + encodeURIComponent(title + "\n" + url), "_blank", "noopener");
  else if (type === "fb") window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url), "_blank", "noopener");
  else if (type === "native" && navigator.share) navigator.share({ title, text: title, url }).catch(() => {});
  else if (type === "copy") {
    const done = () => toast(t("copied"));
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, () => prompt(t("copyPrompt"), url));
    else prompt(t("copyPrompt"), url);
  }
}

function openMenu() {

}
function closeMenu() {
  document.getElementById("menuPanel").classList.remove("open");
